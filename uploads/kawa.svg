<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1108"/>
      <stop offset="100%" style="stop-color:#0d0804"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4A7C59;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#4A7C59;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C17E3A;stop-opacity:0.07"/>
      <stop offset="100%" style="stop-color:#C17E3A;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="280" cy="260" rx="300" ry="220" fill="url(#glow)"/>
  <ellipse cx="540" cy="290" rx="280" ry="200" fill="url(#glow2)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
    <line x1="160" y1="0" x2="160" y2="550"/>
    <line x1="320" y1="0" x2="320" y2="550"/>
    <line x1="480" y1="0" x2="480" y2="550"/>
    <line x1="640" y1="0" x2="640" y2="550"/>
  </g>

  <!-- Logo centered — displayed at ~3x its natural size for card impact -->
  <image href="Screenshot 2026-06-03 153603.png"
         x="230" y="195" width="340" height="160"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Subtle bottom label -->
  <text x="400" y="438" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.2)" text-anchor="middle" letter-spacing="4">UX/UI DESIGN · UGANDA · 2025</text>
</svg>
