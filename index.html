  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "hsl(var(--bg))",
            surface: "hsl(var(--surface))",
            "text-primary": "hsl(var(--text))",
            muted: "hsl(var(--muted))",
            stroke: "hsl(var(--stroke))",
            accent: "hsl(var(--accent))",
          },
          fontFamily: {
            body: ["Inter", "sans-serif"],
            display: ['"Instrument Serif"', "serif"],
          },
          keyframes: {
            "scroll-down": {
              "0%": { transform: "translateY(-100%)" },
              "100%": { transform: "translateY(200%)" },
            },
            "role-fade-in": {
              "0%": { opacity: "0", transform: "translateY(8px)" },
              "100%": { opacity: "1", transform: "translateY(0)" },
            },
            "gradient-shift": {
              "0%": { backgroundPosition: "0% 50%" },
              "50%": { backgroundPosition: "100% 50%" },
              "100%": { backgroundPosition: "0% 50%" },
            },
          },
          animation: {
            "scroll-down": "scroll-down 1.5s ease-in-out infinite",
            "role-fade-in": "role-fade-in 0.4s ease-out",
            "gradient-shift": "gradient-shift 6s ease infinite",
          },
        },
      },
    };

  <style>
    :root {
      --bg: 0 0% 4%;
      --surface: 0 0% 8%;
      --text: 0 0% 96%;
      --muted: 0 0% 53%;
      --stroke: 0 0% 12%;
      --accent: 0 0% 96%;
      --grad-1: #89AACC;
      --grad-2: #4E85BF;
    }

    * { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: hsl(var(--bg));
      color: hsl(var(--text));
      font-family: "Inter", sans-serif;
      overflow-x: hidden;
    }

    /* Hide scrollbar but keep scroll */
    body::-webkit-scrollbar { width: 8px; }
    body::-webkit-scrollbar-track { background: hsl(var(--bg)); }
    body::-webkit-scrollbar-thumb { background: hsl(var(--stroke)); border-radius: 4px; }

    /* Accent gradient */
    .accent-gradient {
      background: linear-gradient(90deg, var(--grad-1) 0%, var(--grad-2) 100%);
    }
    .accent-gradient-animated {
      background: linear-gradient(90deg, var(--grad-1) 0%, var(--grad-2) 50%, var(--grad-1) 100%);
      background-size: 200% 200%;
      animation: gradient-shift 6s ease infinite;
    }
    .accent-text {
      background: linear-gradient(90deg, var(--grad-1) 0%, var(--grad-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* GSAP entrance initial states (avoid flash before timeline runs) */
    .name-reveal { opacity: 0; }
    .blur-in { opacity: 0; }

    /* Scroll-driven reveal (IntersectionObserver replacement for Framer whileInView) */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s cubic-bezier(0.25, 0.1, 0.25, 1),
                  transform 1s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Loading word cycle */
    .word-enter { animation: word-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes word-in {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* Lightbox */
    .lightbox-backdrop { backdrop-filter: blur(16px); }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
  </style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Hook: reveal on scroll into view
function useInView(options = {}) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => {
        if (entry.isIntersecting) {
          setInView(true);
          if (options.once !== false) obs.unobserve(el);
        }
      },
      { threshold: options.threshold ?? 0.15, rootMargin: options.rootMargin ?? "-80px" }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

// Reveal wrapper (Framer whileInView replacement)
function Reveal({ children, className = "", delay = 0, as: Tag = "div" }) {
  const [ref, inView] = useInView();
  return (
    <Tag
      ref={ref}
      className={`reveal ${inView ? "is-visible" : ""} ${className}`}
      style={{ transitionDelay: `${delay}s` }}
    >
      {children}
    </Tag>
  );
}

// Attach an HLS source to a <video> element
function useHls(videoRef, src) {
  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    let hls;
    if (src.endsWith('.m3u8') && window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({ enableWorker: true, lowLatencyMode: true });
      hls.loadSource(src);
      hls.attachMedia(video);
    } else {
      video.src = src;
    }
    const play = () => video.play().catch(() => {});
    video.addEventListener("loadedmetadata", play);
    return () => {
      video.removeEventListener("loadedmetadata", play);
      if (hls) hls.destroy();
    };
  }, [src]);
}

// Smooth scroll to a section id
function scrollToId(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

// Small arrow glyph
function Arrow({ className = "" }) {
  return <span className={`inline-block ${className}`} aria-hidden="true">↗</span>;
}

// Section eyebrow used across sections
function Eyebrow({ children }) {
  return (
    <div className="flex items-center gap-3">
      <span className="w-8 h-px bg-stroke"></span>
      <span className="text-xs text-muted uppercase tracking-[0.3em]">{children}</span>
    </div>
  );
}

// Gradient-bordered button (hover reveals animated accent ring)
function GhostButton({ children, onClick, href, className = "" }) {
  const Tag = href ? "a" : "button";
  const extra = href ? { href } : { onClick };
  return (
    <Tag
      {...extra}
      className={`group relative inline-flex items-center gap-2 rounded-full text-sm px-5 py-2.5 transition-transform duration-300 hover:scale-105 ${className}`}
    >

      <span className="relative z-10 inline-flex items-center gap-2 rounded-full bg-surface px-5 py-2.5 -mx-5 -my-2.5 text-text-primary">
        {children}
      </span>
    </Tag>
  );
}

const LOADING_DURATION = 2700;

function LoadingScreen({ onComplete }) {
  const [count, setCount] = useState(0);
  const [wordIndex, setWordIndex] = useState(0);
  const doneRef = useRef(false);
  const { lang } = useLang();
  const s = I18N[lang].loading;

  // Counter 000 -> 100 via requestAnimationFrame
  useEffect(() => {
    let raf;
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min((now - start) / LOADING_DURATION, 1);
      setCount(Math.floor(p * 100));
      if (p < 1) {
        raf = requestAnimationFrame(tick);
      } else if (!doneRef.current) {
        doneRef.current = true;
        setTimeout(() => onComplete && onComplete(), 400);
      }
    };
    raf = requestAnimationFrame(tick);
    // Safety: if rAF is throttled (e.g. backgrounded tab), still dismiss.
    const safety = setTimeout(() => {
      if (!doneRef.current) {
        doneRef.current = true;
        setCount(100);
        onComplete && onComplete();
      }
    }, LOADING_DURATION + 900);
    return () => {
      cancelAnimationFrame(raf);
      clearTimeout(safety);
    };
  }, []);

  // Rotating words every 900ms
  useEffect(() => {
    const iv = setInterval(() => {
      setWordIndex((i) => (i + 1) % s.words.length);
    }, 900);
    return () => clearInterval(iv);
  }, [s.words.length]);

  return (
    <div className="fixed inset-0 z-[9999] bg-bg overflow-hidden">
      {/* Top-left label */}
      <div
        className="absolute top-8 left-8 text-xs text-muted uppercase tracking-[0.3em]"
        style={{ animation: "word-in 0.8s ease-out both" }}
      >
        {s.label}
      </div>

      {/* Center rotating words */}
      <div className="absolute inset-0 flex items-center justify-center">
        <span
          key={wordIndex}
          className="word-enter text-4xl md:text-6xl lg:text-7xl font-display italic text-text-primary/80"
        >
          {s.words[wordIndex]}
        </span>
      </div>

      {/* Bottom-right counter */}
      <div className="absolute bottom-10 right-8 md:bottom-12 md:right-12">
        <span className="text-6xl md:text-8xl lg:text-9xl font-display text-text-primary tabular-nums leading-none">
          {String(count).padStart(3, "0")}
        </span>
      </div>

      {/* Bottom progress bar */}
      <div className="absolute bottom-0 left-0 right-0 h-[3px] bg-stroke/50">
        <div
          className="h-full accent-gradient origin-left"
          style={{
            transform: `scaleX(${count / 100})`,
            boxShadow: "0 0 8px rgba(137, 170, 204, 0.35)",
          }}
        ></div>
      </div>
    </div>
  );
}

function Explorations() {
  const sectionRef = useRef(null);
  const contentRef = useRef(null);
  const colARef = useRef(null);
  const colBRef = useRef(null);
  const [lightbox, setLightbox] = useState(null);
  const { lang } = useLang();
  const s = I18N[lang].explorations;

  const colSplit = Math.ceil(EXPLORATIONS.length / 2);
  // The parallax columns scale with the number of cards, so the section must too
  // (px per card after the column's upward parallax; smaller cards on phones).
  const perCard = window.innerWidth >= 768 ? 350 : 160;
  const colA = EXPLORATIONS.slice(0, colSplit);
  const colB = EXPLORATIONS.slice(colSplit);

  useEffect(() => {
    if (!window.gsap || !window.ScrollTrigger) return;
    window.gsap.registerPlugin(window.ScrollTrigger);
    const ctx = window.gsap.context(() => {
      // Pin the center content
      window.ScrollTrigger.create({
        trigger: sectionRef.current,
        start: "top top",
        end: "bottom bottom",
        pin: contentRef.current,
        pinSpacing: false,
      });

      // Parallax columns moving at different rates
      window.gsap.to(colARef.current, {
        yPercent: -22,
        ease: "none",
        scrollTrigger: { trigger: sectionRef.current, start: "top bottom", end: "bottom top", scrub: 1 },
      });
      window.gsap.to(colBRef.current, {
        yPercent: -42,
        ease: "none",
        scrollTrigger: { trigger: sectionRef.current, start: "top bottom", end: "bottom top", scrub: 1 },
      });
    }, sectionRef);
    return () => ctx.revert();
  }, []);

  const card = (src, i, rot) => (
    <button
      key={i}
      onClick={() => setLightbox(src)}
      className="group relative block w-full max-w-[320px] mx-auto rounded-3xl overflow-hidden border border-stroke bg-surface"
      style={{ aspectRatio: "1 / 1", transform: `rotate(${rot}deg)` }}
    >
      <img
        src={src}
        alt=""
        loading="lazy"
        className="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
      />
      <div className="absolute inset-0 bg-bg/40 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
    </button>
  );

  return (
    <section ref={sectionRef} className="relative bg-bg" style={{ minHeight: `max(300vh, calc(${colSplit * perCard}px + 24vh))` }}>
      {/* Layer 1: pinned center content */}
      <div ref={contentRef} className="relative z-10 h-screen flex items-center justify-center pointer-events-none">
        <div className="text-center px-6 max-w-lg pointer-events-auto">
          <div className="flex justify-center">
            <Eyebrow>{s.eyebrow}</Eyebrow>
          </div>
          <h2 className="mt-5 text-4xl md:text-5xl lg:text-6xl tracking-tight text-text-primary">
            {s.headingPrefix} <span className="font-display italic">{s.headingItalic}</span>
          </h2>
          <p className="mt-4 text-sm md:text-base text-muted max-w-sm mx-auto">
            {s.subtext}
          </p>
        </div>
      </div>

      {/* Layer 2: parallax columns */}
      <div className="absolute inset-0 z-20 flex items-start justify-center pt-[20vh] pointer-events-none">
        <div className="w-full max-w-[1400px] px-6 grid grid-cols-2 gap-12 md:gap-40">
          <div ref={colARef} className="flex flex-col gap-16 md:gap-28 pointer-events-auto">
            {colA.map((src, i) => card(src, i, i % 2 === 0 ? -4 : 3))}
          </div>
          <div ref={colBRef} className="flex flex-col gap-16 md:gap-28 pt-[30vh] pointer-events-auto">
            {colB.map((src, i) => card(src, i + 10, i % 2 === 0 ? 4 : -3))}
          </div>
        </div>
      </div>

      {lightbox && <Lightbox src={lightbox} onClose={() => setLightbox(null)} />}
    </section>
  );
}

function useActiveSection() {
  const [active, setActive] = useState("home");
  useEffect(() => {
    const ids = ["home", "work", "contact"];
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) setActive(entry.target.id);
        });
      },
      { rootMargin: "-45% 0px -45% 0px", threshold: 0 }
    );
    ids.forEach((id) => {
      const el = document.getElementById(id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);
  return active;
}

                   onChange={(v) => setTweak("eyebrow", v)} />
        <TweakText label="Email" value={t.email}
                   onChange={(v) => setTweak("email", v)} />
        <TweakSection label="Accent" />
        <TweakColor label="Gradient" value={t.accent} options={ACCENT_OPTIONS}
                    onChange={(v) => setTweak("accent", v)} />
      </TweaksPanel>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);


  </script>
</body>
</html>
